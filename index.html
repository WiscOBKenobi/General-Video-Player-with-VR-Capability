<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>General Video Player with VR Capability</title>
  <meta name="description" content="Offline local video and VR player with a session playlist. No uploads." data-i18n-content="description">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="header">
    <a class="brand" href="./index.html" aria-label="General Video Player with VR Capability home" data-i18n-aria-label="home"><img class="brand-icon" src="icon.svg" alt="" width="48" height="48"><strong>General Video Player<span>with VR Capability</span></strong></a>
    <div class="language-switch" role="group" aria-label="Language" data-i18n-aria-label="language">
      <button type="button" data-language="en" lang="en" aria-pressed="true">English</button>
      <button type="button" data-language="zh-CN" lang="zh-CN" aria-pressed="false">中文</button>
    </div>
  </header>
  <main>
    <input id="file" type="file" accept="video/*,.mkv,.mov,.m4v,.webm,.mp4" multiple hidden>
    <div class="workspace">
      <aside class="settings" aria-label="Playback settings" data-i18n-aria-label="settingsAria">
        <div class="settings-title"><h2 data-i18n="settings">View settings</h2></div>
        <fieldset class="mode-setting"><legend data-i18n="mode">Playback mode</legend><div class="segmented playback-modes"><button data-mode="normal" aria-pressed="true" data-i18n="normal">Normal video</button><button data-mode="vr" aria-pressed="false" data-i18n="vr">VR video</button></div></fieldset>
        <div id="vr-settings" hidden>
        <fieldset><legend data-i18n="projection">Projection</legend><div class="mode-grid" id="projection-options">
          <button data-projection="180" aria-pressed="true"><strong>180°</strong><span data-i18n="hemisphere">VR hemisphere</span></button>
          <button data-projection="360" aria-pressed="false"><strong>360°</strong><span data-i18n="panorama">Panoramic</span></button>
        </div></fieldset>
        <div class="setting"><label for="layout" data-i18n="layout">Video layout</label><select id="layout"><option value="sbs" data-i18n="sbs">Side by side (SBS)</option><option value="tb" data-i18n="tb">Top / bottom</option><option value="mono" data-i18n="mono">Single image (Mono)</option></select></div>
        <fieldset id="eye-options"><legend data-i18n="eye">Eye selection</legend><div class="segmented"><button data-eye="left" aria-pressed="true" data-i18n="left">Left eye</button><button data-eye="right" aria-pressed="false" data-i18n="right">Right eye</button><button data-eye="both" aria-pressed="false" data-i18n="both">Both eyes</button></div></fieldset>
        <div class="setting"><div class="label-row"><label for="fov" data-i18n="fov">Field of view</label><output id="fov-value" for="fov">75°</output></div><input id="fov" type="range" min="35" max="110" value="75"><div class="range-labels"><span data-i18n="zoomIn">Zoom in</span><span data-i18n="wide">Wide</span></div></div>
        </div>
      </aside>
      <div class="playback-column">
      <section id="player" class="player" aria-label="Video player" data-i18n-aria-label="player">
        <div class="viewport" id="viewport" tabindex="0" aria-label="Video picture; click or press Space to play or pause, double-click for fullscreen; drag and zoom in VR mode" data-i18n-aria-label="viewport">
          <canvas id="canvas" aria-label="Video picture" data-i18n-aria-label="canvas"></canvas>
          <video id="video" playsinline preload="metadata" hidden></video>
          <div id="empty" class="empty">
            <img class="lens" src="icon.svg" alt="" width="150" height="150">
            <h2 data-i18n="dropHeading">Drop your videos here</h2>
            <button id="choose" class="secondary" data-i18n="choose">Choose video files</button>
          </div>
          <div id="drop-hint" class="drop-hint" data-i18n="dropHint">Drop to start watching</div>
          <div id="notice" class="notice" role="status" hidden></div>
        </div>
        <div class="transport">
          <label class="sr-only" for="seek" data-i18n="progress">Playback position</label><input id="seek" type="range" min="0" max="100" step="0.01" value="0" disabled>
          <div class="transport-row">
            <button id="play" class="icon-button play" aria-label="Play" title="Play / pause (Space)" data-i18n-title="playTitle" disabled>▶</button>
            <button id="stop" class="stop-button" aria-label="Stop and clear" data-i18n-aria-label="stopAria" title="Stop playback and clear the session playlist" data-i18n-title="stopTitle" disabled>■<span data-i18n="stop"> Stop</span></button>
            <button id="back" class="icon-button skip" aria-label="Back 10 seconds" data-i18n-aria-label="back" title="Back 10 seconds" data-i18n-title="back" disabled>↶<small>10</small></button>
            <span id="time" class="time">00:00 <span>/ 00:00</span></span>
            <div class="transport-spacer"></div>
            <button id="mute" class="icon-button" aria-label="Mute" title="Mute / unmute (M)" data-i18n-title="muteTitle">♪</button>
            <label class="sr-only" for="volume" data-i18n="volume">Volume</label><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
            <div class="speed-control"><label class="sr-only" for="speed" data-i18n="speed">Playback speed (0.25 to 4)</label><input id="speed" type="number" min="0.25" max="4" step="any" value="1" inputmode="decimal" autocomplete="off" list="speed-options" title="Enter a speed from 0.25 to 4, e.g. 1.05 or 1.1; press Enter or leave the field to apply" data-i18n-title="speedTitle"><span aria-hidden="true">×</span><datalist id="speed-options"><option value="0.5"></option><option value="0.75"></option><option value="1"></option><option value="1.05"></option><option value="1.1"></option><option value="1.25"></option><option value="1.5"></option><option value="2"></option></datalist></div>
            <button id="reset" class="mini" title="Reset view (R)" data-i18n-title="resetTitle" hidden data-i18n="reset">↺ Reset view</button>
            <button id="fullscreen" class="icon-button" aria-label="Fullscreen" title="Fullscreen (F)" data-i18n-title="fullscreenTitle">⛶</button>
          </div>
        </div>
      </section>
    <div class="filebar"><span class="file-symbol" aria-hidden="true">▤</span><div><strong id="filename">No video selected</strong><span id="fileinfo"></span></div><span id="file-state" class="sr-only" role="status">Ready</span></div>
      </div>
    <section class="playlist" aria-labelledby="playlist-heading">
      <div class="playlist-heading"><div><h2 id="playlist-heading"><span data-i18n="playlist">Session playlist</span> <span id="playlist-count">0 videos</span></h2></div><div class="playlist-actions"><button id="add-files" class="secondary" data-i18n="addVideos">＋ Add videos</button><button id="clear-list" class="clear-list" disabled data-i18n="clearList">Clear all</button></div></div>
      <ol id="playlist-items" aria-label="Videos in this session" data-i18n-aria-label="listAria"></ol>
      <p id="playlist-status" class="sr-only" role="status" aria-live="polite"></p>
    </section>
    </div>
  </main>
</body>
</html>
